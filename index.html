        font-size: clamp(1rem, 2.2vw, 1.5rem);
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 14px 0 18px;
